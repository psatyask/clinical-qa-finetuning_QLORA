services:
  - type: web
    name: clinical-qa-webapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: VLLM_BASE_URL
        sync: false
      - key: VLLM_MODEL_NAME
        value: clinical-qa
      - key: VLLM_API_KEY
        sync: false
